<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <defs>
    <filter id="touchShadow" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="1" dy="2" stdDeviation="2.5" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
    <linearGradient id="fingerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
  </defs>
  <!-- Outer pulse ring on touch -->
  <circle cx="16" cy="16" r="14" fill="#3b82f6" fill-opacity="0.25" stroke="#ffffff" stroke-width="1.5"/>
  <!-- Touch center point -->
  <circle cx="16" cy="16" r="6" fill="#ffffff" filter="url(#touchShadow)"/>
  <circle cx="16" cy="16" r="3.5" fill="#2563eb"/>
  <!-- Stylized hand pointer silhouette -->
  <path d="M16 16 L25 33 L29 27 L37 25 Z" fill="url(#fingerGrad)" stroke="#ffffff" stroke-width="2" stroke-linejoin="round" filter="url(#touchShadow)"/>
</svg>
